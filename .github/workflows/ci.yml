name: Reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Test algorithm invariants and reference integrity
        run: python -m unittest discover -s tests -v
      - name: Audit every stored prediction
        run: python audit.py --reference
      - name: Regenerate the result table
        run: python report.py --output outputs/ci-report
